function getOrCreateDatabaseSpreadsheet() {
  const props = PropertiesService.getScriptProperties();
  try {
    const activeSs = SpreadsheetApp.getActiveSpreadsheet();
    if (activeSs) {
      props.setProperty(PROP_SPREADSHEET_ID, activeSs.getId());
      return activeSs;
    }
  } catch (e) {}

  const savedId = props.getProperty(PROP_SPREADSHEET_ID);
  if (savedId) {
    try {
      const existingSs = SpreadsheetApp.openById(savedId);
      if (existingSs) return existingSs;
    } catch (e) {}
  }

  const createdSs = SpreadsheetApp.create(DEFAULT_SPREADSHEET_TITLE);
  props.setProperty(PROP_SPREADSHEET_ID, createdSs.getId());
  return createdSs;
}

function readSheetObjects(ss, sheetName) {
  const sheet = ss.getSheetByName(sheetName);
  if (!sheet || sheet.getLastRow() <= 1) return [];
  const headers = SHEETS_SCHEMA[sheetName];
  const values = sheet.getRange(2, 1, sheet.getLastRow() - 1, headers.length).getValues();
  return values.map(function(row) {
    const obj = {};
    headers.forEach(function(key, idx) {
      let val = row[idx];
      if (key === 'examOpen' || key === 'passed') {
        val = (val === true || String(val).toLowerCase() === 'true');
      } else if (['durationMinutes', 'targetQuestionCount', 'kktp', 'questionNumber', 'questionCount', 'weight', 'order', 'score'].indexOf(key) !== -1) {
        val = val === '' ? 0 : Number(val);
      } else {
        val = val === null || val === undefined ? '' : String(val);
      }
      obj[key] = val;
    });
    return obj;
  }).filter(function(item) { return item.id !== ''; });
}

function upsertRow(ss, sheetName, record) {
  const sheet = ss.getSheetByName(sheetName);
  const headers = SHEETS_SCHEMA[sheetName];
  if (!record.id) {
    record.id = 'row_' + new Date().getTime() + '_' + Math.floor(Math.random() * 10000);
  }
  const rowValues = headers.map(function(key) {
    const v = record[key];
    return v === undefined || v === null ? '' : v;
  });

  const lastRow = sheet.getLastRow();
  if (lastRow > 1) {
    const existingData = sheet.getRange(2, 1, lastRow - 1, headers.length).getValues();
    let matchedRowIndex = -1;
    for (let i = 0; i < existingData.length; i++) {
      const rowId = String(existingData[i][0] || '').trim();
      if (rowId === String(record.id).trim()) {
        matchedRowIndex = i;
        break;
      }
      if (sheetName === 'Rekap_Nilai_Siswa') {
        const rowNisn = String(existingData[i][2] || '').trim().toLowerCase();
        const rowTeacherId = String(existingData[i][4] || '').trim().toLowerCase();
        const recNisn = String(record.nisn || '').trim().toLowerCase();
        const recTeacherId = String(record.teacherId || '').trim().toLowerCase();
        if (rowNisn && recNisn && rowNisn === recNisn && rowTeacherId === recTeacherId) {
          matchedRowIndex = i;
          rowValues[0] = rowId || record.id;
          break;
        }
      }
    }
    if (matchedRowIndex !== -1) {
      sheet.getRange(matchedRowIndex + 2, 1, 1, headers.length).setValues([rowValues]);
      return String(rowValues[0]);
    }
  }
  sheet.appendRow(rowValues);
  return record.id;
}

function deleteRowById(ss, sheetName, id) {
  const sheet = ss.getSheetByName(sheetName);
  const lastRow = sheet.getLastRow();
  if (lastRow <= 1) return false;
  const ids = sheet.getRange(2, 1, lastRow - 1, 1).getValues();
  for (let i = ids.length - 1; i >= 0; i--) {
    if (String(ids[i][0]) === String(id)) {
      sheet.deleteRow(i + 2);
      return true;
    }
  }
  return false;
}

function jsonOutput(payload) {
  return ContentService
    .createTextOutput(JSON.stringify(payload))
    .setMimeType(ContentService.MimeType.JSON);
}

function doGet(e) {
  try {
    const ss = ensureSheetsInitialized();
    const action = (e && e.parameter && e.parameter.action) || 'getAll';
    if (action === 'ping' || action === 'init') {
      return jsonOutput({
        ok: true,
        spreadsheetName: ss.getName(),
        spreadsheetUrl: ss.getUrl(),
        sheets: Object.keys(SHEETS_SCHEMA)
      });
    }
    return jsonOutput({
      ok: true,
      spreadsheetName: ss.getName(),
      spreadsheetUrl: ss.getUrl(),
      teachers: readSheetObjects(ss, 'Guru_Proktor'),
      tps: readSheetObjects(ss, 'Tujuan_Pembelajaran'),
      blueprints: readSheetObjects(ss, 'Kisi_Kisi_TKA'),
      questions: readSheetObjects(ss, 'Bank_Soal_TKA'),
      sessions: readSheetObjects(ss, 'Rekap_Nilai_Siswa')
    });
  } catch (err) {
    return jsonOutput({ ok: false, error: String(err) });
  }
}

function doPost(e) {
  const lock = LockService.getScriptLock();
  lock.waitLock(15000);
  try {
    const ss = ensureSheetsInitialized();
    const body = JSON.parse(e.postData.contents || '{}');
    const action = body.action;
    const sheetName = TABLE_TO_SHEET[body.table];

    if (action === 'init') {
      return jsonOutput({
        ok: true,
        spreadsheetName: ss.getName(),
        spreadsheetUrl: ss.getUrl()
      });
    }

    if (action === 'upsert' && sheetName && body.data) {
      const savedId = upsertRow(ss, sheetName, body.data);
      return jsonOutput({ ok: true, id: savedId });
    }

    if (action === 'batchUpsert' && Array.isArray(body.items)) {
      body.items.forEach(function(item) {
        const targetSheet = TABLE_TO_SHEET[item.table];
        if (targetSheet && item.data) {
          upsertRow(ss, targetSheet, item.data);
        }
      });
      return jsonOutput({ ok: true, count: body.items.length });
    }

    if (action === 'delete' && sheetName && body.id) {
      const deleted = deleteRowById(ss, sheetName, body.id);
      return jsonOutput({ ok: true, deleted: deleted });
    }

    return jsonOutput({ ok: false, error: 'Aksi tidak dikenali' });
  } catch (err) {
    return jsonOutput({ ok: false, error: String(err) });
  } finally {
    lock.releaseLock();
  }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Pencocokan kepemilikan data (Soal/TP/Kisi-Kisi) dengan normalisasi spasi & fallback teacherToken
    function isOwnedByTeacher(record, teacher) {
      if (!record || !teacher) return false;
      const recTeacherId = String(record.teacherId || '').trim();
      const targetId = String(teacher.id || '').trim();
      if (recTeacherId && targetId && recTeacherId === targetId) {
        return true;
      }
      const recToken = String(record.teacherToken || '').trim().toUpperCase();
      const targetToken = String(teacher.token || '').trim().toUpperCase();
      if (recToken && targetToken && recToken === targetToken) {
        return true;
      }
      return false;
    }

    // Menghitung nomor urut (order) soal berikutnya berdasarkan nilai maksimum agar tidak bertumpuk
    function getNextQuestionOrder(teacher) {
      const teacherQs = state.questions.filter((q) => isOwnedByTeacher(q, teacher));
      if (teacherQs.length === 0) return 1;
      const maxOrder = teacherQs.reduce((maxVal, q) => Math.max(maxVal, Number(q.order) || 0), 0);
      return maxOrder + 1;
    }

    function evaluateOptionBalance(options) {
      if (!Array.isArray(options) || options.length < 2) {
        return {
          isBalanced: true,
          maxVariancePercent: 0,
          minLength: 0,
          maxLength: 0,
          medianLength: 0,
          structuralConsistency: true,
        };
      }
      const cleaned = options.map((o) => String(o || '').trim().replace(/\s+/g, ' ')).filter((o) => o.length > 0);
      if (cleaned.length < 2) {
        return {
          isBalanced: true,
          maxVariancePercent: 0,
          minLength: 0,
          maxLength: 0,
          medianLength: 0,
          structuralConsistency: true,
        };
      }
      const lengths = cleaned.map((o) => o.length);
      const sortedLengths = [...lengths].sort((a, b) => a - b);
      const minLen = sortedLengths[0];
      const maxLen = sortedLengths[sortedLengths.length - 1];
      const medianLen = sortedLengths[Math.floor(sortedLengths.length / 2)];
      const variancePct = maxLen > 0 ? Math.round(((maxLen - minLen) / maxLen) * 100) : 0;

      const clauseCounts = cleaned.map((o) => (o.match(/[,;:]|\b(yang|sehingga|agar|untuk|karena|dengan|dalam|pada)\b/gi) || []).length);
      const minClauses = Math.min(...clauseCounts);
      const maxClauses = Math.max(...clauseCounts);
      const structuralConsistency = variancePct <= 15 && maxClauses - minClauses <= 2;

      return {
        isBalanced: variancePct <= 15,
        maxVariancePercent: variancePct,
        minLength: minLen,
        maxLength: maxLen,
        medianLength: medianLen,
        structuralConsistency,
      };
    }

    const DANGLING_END_WORDS_REGEX =
      /\s+(?:secara|pada|dalam|dengan|untuk|agar|sehingga|karena|yang|sesuai|dan|atau|serta|maupun|di|ke|dari|oleh|sebagai|terhadap|antara|melalui|berdasarkan|menurut|tentang|bagi|guna|demi|atas|bawah|depan|belakang|luar|samping|tengah|antar|per|tiap|setiap|suatu|sebuah|para|sang|si|ini|itu|tersebut)$/i;

    function cleanTrailingDanglingWords(text) {
      let result = String(text || '').trim().replace(/[,;:\-]+$/, '').trim();
      let guard = 0;
      while (DANGLING_END_WORDS_REGEX.test(result) && guard < 5) {
        guard++;
        result = result.replace(DANGLING_END_WORDS_REGEX, '').replace(/[,;:\-]+$/, '').trim();
      }
      return result;
    }

    function harmonizeGeneratedOptions(options, questionType) {
      const clean = (Array.isArray(options) ? options : [])
        .map((o) => String(o || '').trim().replace(/\s+/g, ' '))
        .filter((o) => o !== '');

      if (clean.length < 2 || questionType === 'BENAR_SALAH') {
        return clean;
      }

      return clean.map((opt) => {
        const hadDot = /\.$/.test(opt);
        const body = cleanTrailingDanglingWords(opt.replace(/\.+$/, ''));
        return hadDot ? `${body}.` : body;
      });
    }

    function distributeGeneratedOptionKeys(items) {
      return items.map((item, idx) => {
        const type =
          item.questionType === 'PG_KOMPLEKS' || item.questionType === 'BENAR_SALAH'
            ? item.questionType
            : 'PG';
        const opts = Array.isArray(item.options) ? [...item.options] : [];
        if (opts.length < 2) return item;

        if (type === 'PG') {
          const currentKey =
            Number(item.correctPgIndex) >= 0 && Number(item.correctPgIndex) < opts.length
              ? Number(item.correctPgIndex)
              : 0;
          const targetKey = (idx * 2 + 1) % opts.length;
          if (currentKey !== targetKey) {
            const temp = opts[currentKey];
            opts[currentKey] = opts[targetKey];
            opts[targetKey] = temp;
          }
          return { ...item, options: opts, correctPgIndex: targetKey };
        }

        if (type === 'PG_KOMPLEKS') {
          const validKeys = Array.isArray(item.correctMultiIndices)
            ? item.correctMultiIndices.filter((k) => k >= 0 && k < opts.length)
            : [0, 1];
          const shift = (idx + 1) % opts.length;
          const shiftedOpts = opts.map((_, i) => opts[(i + shift) % opts.length]);
          const shiftedKeys = validKeys
            .map((oldIdx) => (oldIdx - shift + opts.length) % opts.length)
            .sort((a, b) => a - b);
          return { ...item, options: shiftedOpts, correctMultiIndices: shiftedKeys };
        }

        return item;
      });
    }

    function normalizeQuestionRecord(raw) {
      let options = [];
      let correctAnswer = null;
      let analysis = null;
      try {
        options = raw.optionsJson ? JSON.parse(raw.optionsJson) : raw.options || [];

          raw.correctAnswerJson !== undefined && raw.correctAnswerJson !== ''

        correctAnswer = null;

      try {
        analysis = raw.analysisJson ? JSON.parse(raw.analysisJson) : raw.analysis || null;

      }
      const cleanedOptions = Array.isArray(options)
        ? options.map((opt) => String(opt ?? '').trim().replace(/\s+/g, ' '))
        : [];
      const optionBalance = evaluateOptionBalance(cleanedOptions);
      return {
        ...raw,
        weight: Number(raw.weight) || 20,
        order: Number(raw.order) || 0,
        options: cleanedOptions,
        correctAnswer,
        analysis,
        optionBalance,
      };
    }

      return {

    function getSessionStudentExamKey(s) {
      const nisnKey = String(s?.nisn || '').trim().toLowerCase();
      const examKey = String(s?.teacherId || s?.tokenUsed || s?.subject || '').trim().toLowerCase();
      if (!nisnKey || !examKey) return '';
      return `${nisnKey}__${examKey}`;
    }

    function deduplicateSessionsList(rawList) {
      if (!Array.isArray(rawList)) return [];
      const normalizedList = rawList.map(normalizeSessionRecord);
      const bestByKey = new Map();
      const unkeyed = [];
      const duplicateIds = [];

      normalizedList.forEach((item) => {
        const key = getSessionStudentExamKey(item);
        if (!key) {
          unkeyed.push(item);
          return;
        }
        const existing = bestByKey.get(key);
        if (!existing) {
          bestByKey.set(key, item);
          return;
        }

        const itemDone = item.status === 'selesai';
        const existingDone = existing.status === 'selesai';
        let keepNew = false;

        if (itemDone && !existingDone) {
          keepNew = true;
        } else if (!itemDone && existingDone) {
          keepNew = false;
        } else {
          const itemTime = Date.parse(item.finishedAt || item.startedAt || '') || 0;
          const existingTime = Date.parse(existing.finishedAt || existing.startedAt || '') || 0;
          if (itemTime > existingTime) {
            keepNew = true;
          } else if (itemTime === existingTime && (Number(item.score) || 0) > (Number(existing.score) || 0)) {
            keepNew = true;
          }
        }

        if (keepNew) {
          if (existing.id && existing.id !== item.id) duplicateIds.push(existing.id);
          bestByKey.set(key, item);
        } else {
          if (item.id && item.id !== existing.id) duplicateIds.push(item.id);
        }
      });

      const merged = [...bestByKey.values(), ...unkeyed];
      merged._duplicateIds = duplicateIds;
      return merged;
    }

    function generateUniqueToken(existingTokens = [], prefix = '') {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const cleanPrefix = prefix
        .replace(/[^A-Za-z]/g, '')
        .toUpperCase()
        .slice(0, 3);
      let attempt = 0;
      while (attempt < 100) {
        let token = cleanPrefix;
        while (token.length < 6) {
          token += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        if (!existingTokens.includes(token)) return token;
        attempt++;
      }
      return 'TKA' + Math.floor(100 + Math.random() * 900);
    }

    function formatCountdown(totalSeconds) {
      const safe = Math.max(0, Math.floor(totalSeconds));
      const hrs = Math.floor(safe / 3600);
      const mins = Math.floor((safe % 3600) / 60);
      const secs = safe % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return hrs > 0 ? `${pad(hrs)}:${pad(mins)}:${pad(secs)}` : `${pad(mins)}:${pad(secs)}`;
    }

    function formatWaktuID(isoString) {
      if (!isoString) return '-';
      try {
        const d = new Date(isoString);
        return d.toLocaleString('id-ID', {
          day: '2-digit',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });
      } catch {
        return isoString;
      }
    }

    function renderDonutChartSvg(title, badgeText, segments) {
      const total = segments.reduce((acc, s) => acc + s.value, 0);
      const radius = 64;
      const cx = 110;
      const cy = 95;
      let cumulativePercent = 0;

      const slicesHtml =
        total === 0
          ? `<g>
              <circle cx="${cx}" cy="${cy}" r="${radius}" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
              <text x="${cx}" y="${cy + 4}" text-anchor="middle" class="fill-slate-500 text-[11px] font-medium">Belum Ada Data</text>
            </g>`
          : segments
              .map((seg) => {
                const percent = seg.value / total;
                const startAngle = cumulativePercent * 2 * Math.PI - Math.PI / 2;
                cumulativePercent += percent;
                const endAngle = cumulativePercent * 2 * Math.PI - Math.PI / 2;
                const midAngle = (startAngle + endAngle) / 2;

                const x1 = cx + radius * Math.cos(startAngle);
                const y1 = cy + radius * Math.sin(startAngle);
                const x2 = cx + radius * Math.cos(endAngle);
                const y2 = cy + radius * Math.sin(endAngle);
                const largeArcFlag = percent > 0.5 ? 1 : 0;

                const pathData =
                  percent >= 0.999
                    ? `M ${cx} ${cy - radius} A ${radius} ${radius} 0 1 1 ${cx - 0.01} ${cy - radius} Z`
                    : percent > 0
                    ? `M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArcFlag} 1 ${x2} ${y2} Z`
                    : '';

                if (seg.value <= 0) return '';
                const labelR = radius + 16;
                const lx = cx + labelR * Math.cos(midAngle);
                const ly = cy + labelR * Math.sin(midAngle);

                return `
                  <g>
                    <path d="${pathData}" fill="${seg.color}" stroke="#ffffff" stroke-width="2" />
                    <text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" class="fill-slate-700 text-[11px] font-bold">${seg.value}</text>
                  </g>
                `;
              })
              .join('');

      const legendHtml = segments
        .map(
          (seg) => `
          <div class="flex items-center gap-2 text-xs text-slate-600">
            <span class="w-3.5 h-2.5 rounded-sm shrink-0" style="background-color: ${seg.color}"></span>
            <span class="truncate">${escapeHtml(seg.label)}</span>
            <span class="ml-auto font-bold text-slate-800">${seg.value}</span>
          </div>
        `
        )
        .join('');

      return `
        <div class="bg-white rounded-xl border border-slate-200/80 shadow-sm p-5 flex flex-col justify-between">
          <div class="flex items-center justify-between gap-2 mb-3">
            <h4 class="text-sm font-bold text-slate-700">${escapeHtml(title)}</h4>
            <span class="px-3 py-1 rounded-full bg-sky-100 text-sky-700 text-xs font-semibold">${escapeHtml(badgeText)}</span>
          </div>
          <div class="flex flex-col items-center justify-center my-1">
            <svg viewBox="0 0 220 190" class="w-full max-w-[240px] h-auto">${slicesHtml}</svg>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-3 border-t border-slate-100">${legendHtml}</div>
        </div>
      `;
    }

    function loadLocalBackupDb() {
      try {
        const raw = localStorage.getItem(LOCAL_DB_STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.teachers) && parsed.teachers.length > 0) {
          state.teachers = parsed.teachers;
        }
        if (Array.isArray(parsed.tps) && parsed.tps.length > 0) {
          state.tps = parsed.tps;
        }
        if (Array.isArray(parsed.blueprints) && parsed.blueprints.length > 0) {
          state.blueprints = parsed.blueprints;
        }
        if (Array.isArray(parsed.questions) && parsed.questions.length > 0) {
          state.questions = parsed.questions.map(normalizeQuestionRecord);
        }
        if (Array.isArray(parsed.sessions)) {
          state.sessions = deduplicateSessionsList(parsed.sessions);
        }
      } catch {}
    }

    function saveLocalBackupDb() {
      try {
        localStorage.setItem(
          LOCAL_DB_STORAGE_KEY,
          JSON.stringify({
            teachers: state.teachers,
            tps: state.tps,
            blueprints: state.blueprints,
            questions: state.questions.map((q) => ({
              id: q.id,
              teacherId: q.teacherId,
              teacherToken: q.teacherToken,
              tpId: q.tpId,
              tpCode: q.tpCode,
              type: q.type,
              questionText: q.questionText,
              optionsJson: q.optionsJson || JSON.stringify(q.options || []),
              correctAnswerJson: q.correctAnswerJson || JSON.stringify(q.correctAnswer),
              weight: q.weight,
              order: q.order,
              analysisJson: q.analysisJson || JSON.stringify(q.analysis || null),
              createdAt: q.createdAt,
            })),
            sessions: state.sessions,
          })
        );
      } catch {}
    }

    async function safeParseJsonResponse(resp) {
      const text = await resp.text();
      const trimmed = String(text || '').trim();
      if (!trimmed || trimmed.startsWith('<')) {
        throw new Error('Respons server bukan JSON valid (mengembalikan HTML/kosong).');
      }
      return JSON.parse(trimmed);
    }

    async function fetchFromSpreadsheet(overrideUrl = '', silent = true) {
      const targetUrl = (overrideUrl || state.spreadsheetApiUrl || '').trim();
      if (!targetUrl || !targetUrl.startsWith('http')) return false;

      state.isSyncingSheet = true;
      try {
        const sep = targetUrl.includes('?') ? '&' : '?';
        const resp = await fetch(`${targetUrl}${sep}action=getAll&_t=${Date.now()}`, {
          method: 'GET',
          redirect: 'follow',
        });
        const data = await safeParseJsonResponse(resp);
        if (!data || !data.ok) {
          throw new Error(data?.error || 'Gagal membaca data Google Spreadsheet.');
        }

        if (Array.isArray(data.teachers) && data.teachers.length > 0) {
          state.teachers = data.teachers;
        }
        if (Array.isArray(data.tps) && data.tps.length > 0) {
          state.tps = data.tps;
        }
        if (Array.isArray(data.blueprints) && data.blueprints.length > 0) {
          state.blueprints = data.blueprints;
        }
        if (Array.isArray(data.questions) && data.questions.length > 0) {
          state.questions = data.questions.map(normalizeQuestionRecord);
        }
        if (Array.isArray(data.sessions)) {
          const dedupedSessions = deduplicateSessionsList(data.sessions);
          state.sessions = dedupedSessions;
          if (Array.isArray(dedupedSessions._duplicateIds) && dedupedSessions._duplicateIds.length > 0) {
            dedupedSessions._duplicateIds.forEach((dupId) => {
              postToSpreadsheet({ action: 'delete', table: 'sessions', id: dupId }, targetUrl);
            });
          }
        }

        // Segarkan input pengaturan ujian pada panel guru mengikuti data terbaru dari server
        const activeWs = getWorkspaceTeacher();
        if (activeWs) {
          state.examDurationInput = Number(activeWs.durationMinutes) || 60;
          state.examQuestionCountInput = Number(activeWs.targetQuestionCount) || 5;
        }

        state.spreadsheetStatus = {
          connected: true,
          spreadsheetName: data.spreadsheetName || 'Database_PUSMENDIK_TKA_2026',
          spreadsheetUrl: data.spreadsheetUrl || '',
          lastSyncedAt: new Date().toISOString(),
          error: '',
        };
        saveLocalBackupDb();
        if (!silent) {
          showToast('Sinkronisasi data Google Spreadsheet berhasil diperbarui!');
        }
        renderApp();
        return true;
      } catch (err) {
        state.spreadsheetStatus.error =
          'Mode cadangan lokal aktif (koneksi Spreadsheet belum terjangkau atau akses belum disetel ke Anyone).';
        if (!silent) {
          showToast(state.spreadsheetStatus.error, 'warning', 'Sinkronisasi Lokal');
        }
        return false;
      } finally {
        state.isSyncingSheet = false;
        state.isLoadingDb = false;
      }
    }

    async function postToSpreadsheet(payload, overrideUrl = '') {
      const targetUrl = (overrideUrl || state.spreadsheetApiUrl || '').trim();
      if (!targetUrl || !targetUrl.startsWith('http')) {
        return { ok: true, localOnly: true };
      }

      try {
        const resp = await fetch(targetUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          redirect: 'follow',
        });
        const parsed = await safeParseJsonResponse(resp);
        if (parsed && parsed.ok) {
          state.spreadsheetStatus.connected = true;
          if (parsed.spreadsheetName) state.spreadsheetStatus.spreadsheetName = parsed.spreadsheetName;
          if (parsed.spreadsheetUrl) state.spreadsheetStatus.spreadsheetUrl = parsed.spreadsheetUrl;
          state.spreadsheetStatus.error = '';
          return parsed;
        }
        return { ok: true, localFallback: true };
      } catch {
        return { ok: true, localFallback: true };
      }
    }

    async function saveRecordUnified(table, id, dataObj) {
      let recordId =
        id || `${table}_${Date.now()}_${Math.floor(1000 + Math.random() * 9000)}`;
      let fullRecord = { ...dataObj, id: recordId };

      if (table === 'teachers') {
        const idx = state.teachers.findIndex((x) => x.id === recordId);
        if (idx >= 0) state.teachers[idx] = { ...state.teachers[idx], ...fullRecord };
        else state.teachers.push(fullRecord);
      } else if (table === 'tps') {
        const idx = state.tps.findIndex((x) => x.id === recordId);
        if (idx >= 0) state.tps[idx] = { ...state.tps[idx], ...fullRecord };
        else state.tps.push(fullRecord);
      } else if (table === 'blueprints') {
        const idx = state.blueprints.findIndex((x) => x.id === recordId);
        if (idx >= 0) state.blueprints[idx] = { ...state.blueprints[idx], ...fullRecord };
        else state.blueprints.push(fullRecord);
      } else if (table === 'questions') {
        const normalized = normalizeQuestionRecord(fullRecord);
        const idx = state.questions.findIndex((x) => x.id === recordId);
        if (idx >= 0) state.questions[idx] = normalized;
        else state.questions.push(normalized);
      } else if (table === 'sessions') {
        const studentExamKey = getSessionStudentExamKey(fullRecord);
        const existingSameKey = studentExamKey
          ? state.sessions.find((x) => x.id === recordId || getSessionStudentExamKey(x) === studentExamKey)
          : state.sessions.find((x) => x.id === recordId);

        if (existingSameKey) {
          recordId = existingSameKey.id;
          fullRecord = { ...existingSameKey, ...fullRecord, id: recordId };
        }

        const orphanIds = studentExamKey
          ? state.sessions
              .filter((x) => x.id !== recordId && getSessionStudentExamKey(x) === studentExamKey)
              .map((x) => x.id)
          : [];

        const normalized = normalizeSessionRecord(fullRecord);
        const filteredOthers = state.sessions.filter(
          (x) => x.id !== recordId && (!studentExamKey || getSessionStudentExamKey(x) !== studentExamKey)
        );
        state.sessions = [normalized, ...filteredOthers];

        orphanIds.forEach((orphanId) => {
          postToSpreadsheet({ action: 'delete', table: 'sessions', id: orphanId });
        });
      }

      saveLocalBackupDb();
      await postToSpreadsheet({ action: 'upsert', table, data: fullRecord });
      return recordId;
    }

    async function deleteRecordUnified(table, id) {
      let deletedQuestionRecord = null;
      if (table === 'questions') {
        deletedQuestionRecord = state.questions.find((x) => x.id === id) || null;
      }

      if (table === 'teachers') {
        state.teachers = state.teachers.filter((x) => x.id !== id);
      } else if (table === 'tps') {
        state.tps = state.tps.filter((x) => x.id !== id);
      } else if (table === 'blueprints') {
        state.blueprints = state.blueprints.filter((x) => x.id !== id);
      } else if (table === 'questions') {
        state.questions = state.questions.filter((x) => x.id !== id);
      } else if (table === 'sessions') {
        const target = state.sessions.find((x) => x.id === id);
        const targetKey = target ? getSessionStudentExamKey(target) : '';
        const extraIds = targetKey
          ? state.sessions.filter((x) => x.id !== id && getSessionStudentExamKey(x) === targetKey).map((x) => x.id)
          : [];
        state.sessions = state.sessions.filter(
          (x) => x.id !== id && (!targetKey || getSessionStudentExamKey(x) !== targetKey)
        );
        extraIds.forEach((extraId) => {
          postToSpreadsheet({ action: 'delete', table: 'sessions', id: extraId });
        });
      }

      saveLocalBackupDb();
      await postToSpreadsheet({ action: 'delete', table, id });

      // Sinkronkan targetQuestionCount milik guru saat butir soal dihapus
      if (table === 'questions' && deletedQuestionRecord) {
        const ownerTeacher = state.teachers.find((t) => isOwnedByTeacher(deletedQuestionRecord, t));
        if (ownerTeacher) {
          const remainingCount = state.questions.filter((q) => isOwnedByTeacher(q, ownerTeacher)).length;
          const syncedTarget = remainingCount > 0 ? remainingCount : 0;
          await saveRecordUnified('teachers', ownerTeacher.id, {
            ...ownerTeacher,
            targetQuestionCount: syncedTarget,
          });
          if (getWorkspaceTeacher()?.id === ownerTeacher.id) {
            state.examQuestionCountInput = syncedTarget || 1;
          }
        }
      }

      renderApp();
      showToast('Data berhasil dihapus.', 'success', 'Terhapus');
    }

    async function callGeminiTkaJson(systemPrompt, userPrompt, responseSchema, overrideApiKey = '') {
      const apiKey = (overrideApiKey || getStoredGeminiApiKey() || DEFAULT_GEMINI_API_KEY).trim();
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${encodeURIComponent(apiKey)}`;

      const requestBody = JSON.stringify({
        systemInstruction: {
          parts: [{ text: systemPrompt }],
        },
        contents: [
          {
            role: 'user',
            parts: [{ text: userPrompt }],
          },
        ],
        generationConfig: {
          temperature: 0.65,
          responseMimeType: 'application/json',
          responseSchema,
        },
      });

      const retryDelays = [1000, 2000, 4000];
      let lastError = null;

      for (let attempt = 0; attempt <= retryDelays.length; attempt++) {
        try {
          const resp = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-goog-api-key': apiKey,
            },
            body: requestBody,
          });

          const payload = await safeParseJsonResponse(resp);
          if (!resp.ok || payload.error) {
            throw new Error(payload?.error?.message || `HTTP ${resp.status} dari layanan Gemini AI`);
          }

          const rawText = payload?.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const cleanedJson = rawText
            .replace(/^```json\s*/i, '')
            .replace(/```\s*$/i, '')
            .trim();

          if (!cleanedJson) {
            throw new Error('Respons konten Gemini AI kosong.');
          }

          return JSON.parse(cleanedJson);
        } catch (err) {
          lastError = err;
          if (attempt < retryDelays.length) {
            await new Promise((resolve) => setTimeout(resolve, retryDelays[attempt]));
          }
        }
      }

      throw lastError || new Error('Gagal menghubungi Gemini AI');
    }

    async function handleStudentLogin(e) {
      e.preventDefault();
      if (state.isLoggingInStudent) return;

      const name = state.loginForm.studentName.trim();
      const nisn = state.loginForm.studentNisn.trim();
      const studentClass = state.loginForm.studentClass.trim().toUpperCase();
      const token = state.loginForm.studentToken.trim().toUpperCase();

      if (!name || !nisn || !studentClass || !token) {
        state.loginForm.studentError = 'Seluruh identitas peserta (Nama, NISN, Kelas, dan Token Ujian) wajib diisi.';
        renderApp();
        return;
      }

      // Sinkronkan data terbaru dari Google Spreadsheet sebelum validasi token & paket soal siswa
      if (isSpreadsheetMode()) {
        state.isLoggingInStudent = true;
        state.loginForm.studentError = '';
        setGlobalProgress(true, 'Menyinkronkan paket soal & jadwal terbaru...');
        renderApp();
        try {
          await fetchFromSpreadsheet(state.spreadsheetApiUrl, true);
        } finally {
          state.isLoggingInStudent = false;
          setGlobalProgress(false, '');
        }
      }

      const teacher = state.teachers.find((t) => (t.token || '').trim().toUpperCase() === token);
      if (!teacher) {
        state.loginForm.studentError = `Token Ujian "${token}" tidak ditemukan. Periksa kembali token dari guru Anda.`;
        renderApp();
        return;
      }

      if (teacher.examOpen === false) {
        state.loginForm.studentError = `Sesi ujian untuk mata pelajaran ${teacher.subject} sedang DITUTUP oleh Proktor/Guru.`;
        renderApp();
        return;
      }

      const teacherQuestions = state.questions
        .filter((q) => isOwnedByTeacher(q, teacher))
        .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));

      if (teacherQuestions.length === 0) {
        state.loginForm.studentError = `Bank soal untuk mata pelajaran ${teacher.subject} belum tersedia.`;
        renderApp();
        return;
      }

      const configuredTarget = Number(teacher.targetQuestionCount);
      const maxQuestions =
        configuredTarget > 0 ? Math.min(teacherQuestions.length, configuredTarget) : teacherQuestions.length;
      const selectedQuestions = teacherQuestions.slice(0, maxQuestions);

      state.loginForm.studentError = '';
      state.studentSession = {
        profile: { name, nisn, studentClass, token },
        teacher,
        integrityAgreed: false,
        activeSessionId: null,
        questions: selectedQuestions,
        currentQIndex: 0,
        answers: {},
        doubtFlags: {},
        fontScale: 'base',
        remainingSeconds: (Number(teacher.durationMinutes) || 60) * 60,
        resultSummary: null,
        violationCount: 0,
        maxViolations: 3,
        violationWarningModal: null,
        lastViolationTimestamp: 0,
        isEnteringFullscreen: false,
        isViolationAutoFinished: false,
      };
      state.currentView = 'student_confirm';
      renderApp();
    }

    function handleProktorLogin(e) {

    async function registerStudentViolation(reason) {
      if (state.currentView !== 'student_exam') return;
      const ss = state.studentSession;
      if (!ss.profile || !ss.teacher || state.isSubmittingExam || ss.isEnteringFullscreen) return;

      const now = Date.now();
      if (now - (ss.lastViolationTimestamp || 0) < 1500) return;
      ss.lastViolationTimestamp = now;

      const maxV = ss.maxViolations || 3;
      ss.violationCount = (ss.violationCount || 0) + 1;

      if (ss.violationCount >= maxV) {
        state.confirmModal = null;
        ss.violationWarningModal = null;
        exitExamFullscreen();
        await handleFinishExam(false, true);
        return;
      }

      ss.violationWarningModal = {
        count: ss.violationCount,
        max: maxV,
        reason: reason || 'Meninggalkan layar ujian',
      };
      renderApp();
      renderModals();
    }

    function isQuestionAnswered(q) {
      const ans = state.studentSession.answers[q.id];
      if (q.type === 'PG') {
        return typeof ans === 'number';
      }
      if (q.type === 'PG_KOMPLEKS') {
        return Array.isArray(ans) && ans.length > 0;
      }
      if (q.type === 'BENAR_SALAH') {
        if (!ans || typeof ans !== 'object') return false;
        const totalStmt = (q.options || []).length;
        return totalStmt > 0 && Object.keys(ans).length >= totalStmt;
      }
      return false;
    }

    function selectPgOption(qId, optIdx) {
      state.studentSession.answers[qId] = optIdx;
      renderApp();
    }

    function togglePgKompleksOption(qId, optIdx) {
      const prev = Array.isArray(state.studentSession.answers[qId]) ? state.studentSession.answers[qId] : [];
      if (prev.includes(optIdx)) {
        state.studentSession.answers[qId] = prev.filter((x) => x !== optIdx);
      } else {
        state.studentSession.answers[qId] = [...prev, optIdx].sort((a, b) => a - b);
      }
      renderApp();
    }

    function setBenarSalahAnswer(qId, sIdx, boolVal) {
      const prev = state.studentSession.answers[qId] || {};
      state.studentSession.answers[qId] = { ...prev, [sIdx]: boolVal };

      const unanswered = total - answered;

    async function handleFinishExam(isAutoTimeout = false, isViolationAutoFinish = false) {
      const ss = state.studentSession;
      if (!ss.profile || !ss.teacher || ss.questions.length === 0 || state.isSubmittingExam) return;

      state.isSubmittingExam = true;
      ss.violationWarningModal = null;
      exitExamFullscreen();
      renderApp();

      try {
        let totalWeight = 0;
        let earnedWeight = 0;
        const tpAccumulator = {};

        ss.questions.forEach((q) => {
          const w = Number(q.weight) || 20;
          totalWeight += w;
          const ans = ss.answers[q.id];
          let ratio = 0;

          if (q.type === 'PG') {
            if (typeof ans === 'number' && ans === Number(q.correctAnswer)) {
              ratio = 1;
            }
          } else if (q.type === 'PG_KOMPLEKS') {
            const correctSet = Array.isArray(q.correctAnswer) ? q.correctAnswer : [];
            const userSet = Array.isArray(ans) ? ans : [];
            if (correctSet.length > 0 && userSet.length > 0) {
              let hits = 0;
              let wrongPicks = 0;
              userSet.forEach((pick) => {
                if (correctSet.includes(pick)) hits += 1;
                else wrongPicks += 1;
              });
              ratio = Math.max(0, (hits - wrongPicks * 0.5) / correctSet.length);
            }
          } else if (q.type === 'BENAR_SALAH') {
            const correctArr = Array.isArray(q.correctAnswer) ? q.correctAnswer : [];
            const userObj = ans && typeof ans === 'object' ? ans : {};
            if (correctArr.length > 0) {
              let matches = 0;
              correctArr.forEach((expectedBool, idx) => {
                if (userObj[idx] === expectedBool) matches += 1;
              });
              ratio = matches / correctArr.length;
            }
          }

          const earned = w * ratio;
          earnedWeight += earned;

          const tpKey = q.tpCode || 'TP.1';
          if (!tpAccumulator[tpKey]) {
            const tpMeta = state.tps.find(
              (t) => isOwnedByTeacher(t, ss.teacher) && (t.id === q.tpId || t.code === tpKey)
            );
            tpAccumulator[tpKey] = {
              tpCode: tpKey,
              description: tpMeta?.description || `Capaian Pembelajaran ${tpKey}`,
              kktp: Number(tpMeta?.kktp) || 75,
              totalW: 0,
              earnedW: 0,
            };
          }
          tpAccumulator[tpKey].totalW += w;
          tpAccumulator[tpKey].earnedW += earned;
        });

        const finalScore = totalWeight > 0 ? Math.round((earnedWeight / totalWeight) * 100) : 0;
        const tpBreakdown = Object.values(tpAccumulator).map((item) => {
          const tpScore = item.totalW > 0 ? Math.round((item.earnedW / item.totalW) * 100) : 0;
          return {
            tpCode: item.tpCode,
            description: item.description,
            kktp: item.kktp,
            score: tpScore,
            passed: tpScore >= item.kktp,
          };
        });

        const avgKktp =
          tpBreakdown.length > 0
            ? Math.round(tpBreakdown.reduce((a, b) => a + b.kktp, 0) / tpBreakdown.length)
            : 75;
        const overallPassed = finalScore >= avgKktp;

        const existingSession = state.sessions.find(
          (s) =>
            (ss.activeSessionId && s.id === ss.activeSessionId) ||
            (String(s.nisn || '').trim().toLowerCase() === String(ss.profile.nisn).trim().toLowerCase() &&
              String(s.teacherId || '').trim().toLowerCase() === String(ss.teacher.id).trim().toLowerCase())
        );

        await saveRecordUnified('sessions', existingSession ? existingSession.id : ss.activeSessionId, {
          studentName: ss.profile.name,
          nisn: ss.profile.nisn,
          studentClass: ss.profile.studentClass,
          teacherId: ss.teacher.id,
          teacherName: ss.teacher.name,
          subject: ss.teacher.subject,
          tokenUsed: ss.profile.token,
          status: 'selesai',
          startedAt: existingSession?.startedAt || new Date().toISOString(),
          finishedAt: new Date().toISOString(),
          score: finalScore,
          passed: overallPassed,
          tpBreakdownJson: JSON.stringify(tpBreakdown),
          answersJson: JSON.stringify(ss.answers),
        });

        ss.isViolationAutoFinished = Boolean(isViolationAutoFinish);
        ss.resultSummary = {
          score: finalScore,
          passed: overallPassed,
          tpBreakdown,
        };
        state.currentView = 'student_result';
        if (isViolationAutoFinish) {
          showToast(
            'Batas pelanggaran keamanan tercapai (3/3). Sistem otomatis mengakhiri tes dan mengirimkan jawaban Anda.',
            'error',
            'Tes Diakhiri Otomatis'
          );
        } else if (isAutoTimeout) {
          showToast('Waktu pengerjaan telah habis. Jawaban Anda otomatis dikumpulkan.', 'warning', 'Waktu Habis');
        }
      } finally {
        state.isSubmittingExam = false;
        renderApp();
      }
    }

    async function handleUpdateExamSettings(toggleOpen = false) {
      const ws = getWorkspaceTeacher();
      if (!ws) return;

      const availableQuestions = state.questions.filter((q) => isOwnedByTeacher(q, ws)).length;
      const durationMinutes = Math.max(5, Math.min(240, Number(state.examDurationInput) || 60));
      const rawTargetCount = Math.max(1, Math.min(100, Number(state.examQuestionCountInput) || 5));

      if (!toggleOpen && availableQuestions > 0 && rawTargetCount > availableQuestions) {
        showToast(
          `Jumlah butir soal ditampilkan (${rawTargetCount}) melebihi ketersediaan Bank Soal saat ini (${availableQuestions} butir). Masukkan maksimal ${availableQuestions} soal.`,
          'error',
          'Validasi Jumlah Soal'
        );
        return;
      }

      const targetQuestionCount =
        availableQuestions > 0 ? Math.min(rawTargetCount, availableQuestions) : rawTargetCount;
      state.examQuestionCountInput = targetQuestionCount;
      const nextExamOpen = toggleOpen ? !(ws.examOpen !== false) : ws.examOpen !== false;

      await runWithSavingAnimation(
        'Menyimpan pengaturan ujian...',

          await saveRecordUnified('teachers', ws.id, {
            ...ws,
            durationMinutes,
            targetQuestionCount,
            examOpen: nextExamOpen,
          });
        },
        toggleOpen
          ? `Status sesi ujian diubah menjadi ${nextExamOpen ? 'DIBUKA' : 'DITUTUP'}.`

    async function generateAndSaveTkaBundleForTp(teacher, tpRecord, count = 5) {
      const targetCount = Math.max(1, Math.min(30, Number(count) || 5));
      const selectedDeepPhase = tpRecord.deepLearningPhase || DEEP_LEARNING_EXPERIENCES[1];

- UU No. 20 Tahun 2003 Pasal 57–59 & PP No. 57/2021 jo. PP No. 4/2022 (validitas isi evaluasi hasil belajar);

- Perka BSKAP No. 45 & 47 Tahun 2025 tentang Kerangka Asesmen TKA;
- Panduan Pembelajaran Mendalam (Deep Learning) Kemendikdasmen 2025/2026.

ATURAN WAJIB PENYUSUNAN SOAL TKA & PEMBELAJARAN MENDALAM:
1. VALIDITAS ISI SESUAI TP (UU SISDIKNAS): Seluruh butir soal WAJIB mengukur kompetensi spesifik yang tertuang dalam Deskripsi Capaian Tujuan Pembelajaran (TP) pada mata pelajaran "${teacher.subject}". DILARANG membuat soal di luar topik TP atau soal generik.
2. PENDEKATAN PEMBELAJARAN MENDALAM (DEEP LEARNING):
   - Terapkan 3 Prinsip Pembelajaran Mendalam: Berkesadaran (Mindful — mendorong kesadaran proses berpikir/analisis), Bermakna (Meaningful — mengaitkan konsep dengan masalah dunia nyata/konteks lokal), dan Menggembirakan (Joyful — stimulus menarik yang memicu rasa ingin tahu).
   - Arahkan pada pengalaman belajar "${selectedDeepPhase}" dan penguatan dimensi profil lulusan "${selectedGradDim}".
3. STIMULUS KONTEKSTUAL FUNGSIONAL: Setiap butir soal WAJIB diawali stimulus kontekstual nyata (studi kasus autentik, data numerik/tabel, kutipan teks informasi/sastra, atau fenomena empiris) yang benar-benar berfungsi untuk menjawab soal. DILARANG menyalin kalimat deskripsi TP secara mentah-mentah ke dalam pokok soal.
4. LEVEL KOGNITIF HOTS (L2 & L3): Fokuskan seluruh butir soal pada Level Kognitif L2 (Aplikasi/C3) dan L3 (Penalaran/C4–C5). DILARANG membuat soal hafalan definisi (L1).
5. KEUNIKAN SKENARIO PER BUTIR: Setiap butir soal WAJIB memiliki studi kasus, angka, nama entitas, dan sudut pandang masalah yang unik (tidak boleh ada pengulangan skenario).
6. VARIASI BENTUK SOAL RESMI TKA: Variasikan bentuk soal secara proporsional antara "PG" (Pilihan Ganda 5 opsi A–E, 1 jawaban benar), "PG_KOMPLEKS" (Pilihan Ganda Kompleks 4–5 opsi, >1 jawaban benar), dan "BENAR_SALAH" (3–4 pernyataan mandiri dengan nilai kebenaran boolean).
7. KESETARAAN STRUKTUR KALIMAT & PANJANG TEKS ALAMI (EYD EDISI V):
   - Pengecoh harus homogen, rasional, dan berasal dari miskonsepsi konsep mata pelajaran tersebut. DILARANG membuat pengecoh absurd atau klise ("semua jawaban benar/salah").
   - Gunakan struktur kalimat paralel dan utuh sesuai EYD Edisi V (JANGAN PERNAH menempelkan frasa tambahan buatan mesin dan JANGAN mengakhiri opsi dengan kata depan gantung seperti "secara", "pada", "dalam", atau "sesuai").
   - KUNCI JAWABAN DILARANG MENJADI OPSI PALING PANJANG: Buatlah minimal 2 opsi pengecoh sama panjang atau sedikit lebih panjang (1–6 karakter lebih panjang) secara alami dibandingkan kunci jawaban, dengan selisih antara opsi terpanjang dan terpendek MAKSIMAL 12% ((panjang_maks - panjang_min) / panjang_maks <= 0.12).
8. SEBARAN KUNCI JAWABAN: Acak posisi kunci jawaban sehingga tersebar merata.`;

      const responseSchema = {
        type: 'OBJECT',
        properties: {
          items: {
            type: 'ARRAY',
            items: {
              type: 'OBJECT',
              properties: {
                deepLearningPhase: { type: 'STRING' },
                graduateDimension: { type: 'STRING' },
                material: { type: 'STRING' },
                stimulusType: { type: 'STRING' },
                indicator: { type: 'STRING' },
                cognitiveLevel: { type: 'STRING' },
                questionType: { type: 'STRING' },
                questionText: { type: 'STRING' },
                optionStructureSummary: { type: 'STRING' },
                options: {
                  type: 'ARRAY',
                  items: { type: 'STRING' },

                correctPgIndex: { type: 'INTEGER' },
                correctMultiIndices: {

                  items: { type: 'INTEGER' },

                'stimulusType',
                'indicator',
                'cognitiveLevel',
                'questionType',
                'questionText',
                'optionStructureSummary',

        required: ['items'],
      };

      const BATCH_SIZE = 5;
      let generatedItems = [];
      const usedTopicsSummary = [];
      let fallbackCountUsed = 0;

      while (generatedItems.length < targetCount) {
        const remaining = targetCount - generatedItems.length;
        const currentBatchSize = Math.min(BATCH_SIZE, remaining);
        const batchNumber = Math.floor(generatedItems.length / BATCH_SIZE) + 1;

        const antiRepeatInstruction =
          usedTopicsSummary.length > 0
            ? `\n\nPENTING — LARANGAN PENGULANGAN SKENARIO (BATCH KE-${batchNumber}):\nButir-butir berikut SUDAH DIBUAT sebelumnya. Anda WAJIB membuat studi kasus, angka, dan subtopik yang 100% BARU dan BERBEDA dari daftar ini:\n- ${usedTopicsSummary.join('\n- ')}`
            : '';

        const userPrompt = `Susun paket lengkap sebanyak ${currentBatchSize} butir Kisi-Kisi Pembelajaran Mendalam dan ${currentBatchSize} butir Soal TKA yang UNIK dan BERBEDA satu sama lain untuk:
- Mata Pelajaran: ${teacher.subject}
- Kode TP: ${tpRecord.code}
- Fase / Kelas: ${tpRecord.phase}
- Pengalaman Belajar Mendalam Utama: ${selectedDeepPhase}
- Dimensi Profil Lulusan: ${selectedGradDim}
- Deskripsi Capaian TP (WAJIB DIJADIKAN RUJUKAN UTAMA): ${tpRecord.description}
- KKTP Minimal: ${tpRecord.kktp}${antiRepeatInstruction}

Pastikan setiap soal benar-benar mengukur capaian TP di atas dengan prinsip Pembelajaran Mendalam (Berkesadaran, Bermakna, Menggembirakan), memiliki stimulus kontekstual fungsional, bebas dari pengulangan skenario, memiliki opsi kalimat alami sesuai EYD V dengan selisih panjang <= 12% (kunci jawaban BUKAN opsi paling panjang), serta posisi kunci jawaban teracak merata.`;

        try {
          const aiResult = await callGeminiTkaJson(systemPrompt, userPrompt, responseSchema);
          if (aiResult && Array.isArray(aiResult.items) && aiResult.items.length > 0) {
            const batchNormalized = aiResult.items.slice(0, currentBatchSize).map((raw) => {
              const qType =
                raw.questionType === 'PG_KOMPLEKS' || raw.questionType === 'BENAR_SALAH'
                  ? raw.questionType
                  : 'PG';
              const harmonizedOpts = harmonizeGeneratedOptions(raw.options || [], qType);
              usedTopicsSummary.push(
                `${raw.material || 'Materi'}: ${String(raw.questionText || '').replace(/\s+/g, ' ').slice(0, 95)}...`
              );
              return {
                ...raw,
                deepLearningPhase: raw.deepLearningPhase || selectedDeepPhase,
                graduateDimension: raw.graduateDimension || selectedGradDim,
                questionType: qType,
                options: harmonizedOpts,
              };
            });
            generatedItems.push(...batchNormalized);
          } else {
            throw new Error('Format output AI tidak memuat daftar butir soal.');
          }
        } catch {
          fallbackCountUsed += currentBatchSize;
          const fallbackSlice = buildFallbackTkaBundle(
            teacher,
            tpRecord,
            currentBatchSize,
            generatedItems.length
          );
          fallbackSlice.forEach((fb) => {
            usedTopicsSummary.push(`${fb.material}: ${String(fb.questionText || '').slice(0, 80)}...`);
          });
          generatedItems.push(...fallbackSlice);
        }
      }

      if (fallbackCountUsed > 0) {
        showToast(
          `Sebagian soal (${fallbackCountUsed} butir) disusun menggunakan bank templat terstandar sesuai TP karena koneksi API sedang padat.`,
          'warning',
          'Info Generator'
        );
      }

      generatedItems = distributeGeneratedOptionKeys(generatedItems.slice(0, targetCount));

      const existingBps = state.blueprints.filter((b) => isOwnedByTeacher(b, teacher));
      let nextBpNumber = existingBps.reduce((acc, b) => acc + Math.max(1, Number(b.questionCount) || 1), 0) + 1;
      let nextQOrder = getNextQuestionOrder(teacher);
      const weightPerItem = Math.max(1, Math.round(100 / generatedItems.length));

      const batchPayloadItems = [];

      for (let i = 0; i < generatedItems.length; i++) {
        const item = generatedItems[i];
        const bpId = `blueprints_${Date.now()}_${i}_${Math.floor(Math.random() * 9000)}`;
        const bpRecord = {
          id: bpId,
          teacherId: teacher.id,
          teacherToken: teacher.token,
          tpId: tpRecord.id,
          tpCode: tpRecord.code,
          questionNumber: nextBpNumber++,
          questionCount: 1,
          deepLearningPhase: item.deepLearningPhase || selectedDeepPhase,
          graduateDimension: item.graduateDimension || selectedGradDim,
          material: item.material || `Materi Esensial ${tpRecord.code}`,
          indicator: item.indicator || `Disajikan stimulus kontekstual, peserta didik dapat memecahkan masalah terkait ${tpRecord.code}.`,
          cognitiveLevel: item.cognitiveLevel || 'L2 - Aplikasi (C3)',
          questionType: item.questionType,
          stimulusType: item.stimulusType || 'Studi Kasus Kontekstual',
          createdAt: new Date().toISOString(),
        };
        state.blueprints.push(bpRecord);
        batchPayloadItems.push({ table: 'blueprints', data: bpRecord });

        let correctAnswer = 0;
        if (item.questionType === 'PG') {
          correctAnswer =
            typeof item.correctPgIndex === 'number' &&
            item.correctPgIndex >= 0 &&
            item.correctPgIndex < item.options.length
              ? item.correctPgIndex
              : 0;
        } else if (item.questionType === 'PG_KOMPLEKS') {
          const validMulti = Array.isArray(item.correctMultiIndices)
            ? item.correctMultiIndices.filter((idx) => idx >= 0 && idx < item.options.length)
            : [];
          correctAnswer = validMulti.length > 0 ? validMulti : [0, 1];
        } else {
          const validBs = Array.isArray(item.correctBsBooleans)
            ? item.correctBsBooleans.slice(0, item.options.length).map(Boolean)
            : [];
          while (validBs.length < item.options.length) {
            validBs.push(validBs.length % 2 === 0);
          }
          correctAnswer = validBs;
        }

        const localAudit = runLocalTkaAuditHeuristic({
          subject: teacher.subject,
          tpCode: tpRecord.code,
          tpDesc: tpRecord.description,
          type: item.questionType,
          questionText: item.questionText,
          options: item.options,
        });

        const qId = `questions_${Date.now()}_${i}_${Math.floor(Math.random() * 9000)}`;
        const rawQuestionRecord = {
          id: qId,
          teacherId: teacher.id,
          teacherToken: teacher.token,
          tpId: tpRecord.id,
          tpCode: tpRecord.code,
          type: item.questionType,
          questionText: item.questionText,
          optionsJson: JSON.stringify(item.options),
          correctAnswerJson: JSON.stringify(correctAnswer),
          weight: weightPerItem,
          order: nextQOrder++,
          analysisJson: JSON.stringify(localAudit),
          createdAt: new Date().toISOString(),
        };

        state.questions.push(normalizeQuestionRecord(rawQuestionRecord));
        batchPayloadItems.push({ table: 'questions', data: rawQuestionRecord });
      }

      // Selaraskan otomatis kuota targetQuestionCount pada profil guru dengan total soal terkini
      const updatedTotalQuestions = state.questions.filter((q) => isOwnedByTeacher(q, teacher)).length;
      const teacherIdx = state.teachers.findIndex((t) => t.id === teacher.id);
      if (teacherIdx >= 0) {
        const updatedTeacherRecord = {
          ...state.teachers[teacherIdx],
          targetQuestionCount: updatedTotalQuestions,
        };
        state.teachers[teacherIdx] = updatedTeacherRecord;
        batchPayloadItems.push({ table: 'teachers', data: updatedTeacherRecord });
      }
      if (getWorkspaceTeacher()?.id === teacher.id) {
        state.examQuestionCountInput = updatedTotalQuestions;
      }

      saveLocalBackupDb();
      await postToSpreadsheet({ action: 'batchUpsert', items: batchPayloadItems });
      return generatedItems.length;
    }

    function resetQuestionForm() {

    function runLocalTkaAuditHeuristic({ subject, tpCode, tpDesc, type, questionText, options }) {
      const qClean = String(questionText || '').trim();
      const qLower = qClean.toLowerCase();
      const cleanOpts = (options || []).map((o) => String(o || '').trim()).filter((o) => o !== '');
      const balanceInfo = evaluateOptionBalance(cleanOpts);

      let score = 100;
      const materiNotes = [];
      const konstruksiNotes = [];
      const bahasaNotes = [];
      const fixActions = [];

      const hasStimulus = qClean.length >= 110 && (qClean.includes('\n') || qClean.includes(':') || /\d/.test(qClean));
      const tpSnippet = String(tpDesc || '').trim().toLowerCase().slice(0, 38);
      const hasRawTpPaste = tpSnippet.length >= 20 && qLower.includes(tpSnippet);
      const isGenericBoilerplate =
        /dalam sebuah proyek evaluasi lapangan.*memenuhi standar capaian minimal/i.test(qClean) ||
        /dalam konteks pencapaian kompetensi.*pada mata pelajaran/i.test(qClean);

      if (hasRawTpPaste) {
        score -= 22;
        materiNotes.push('Terdeteksi salinan teks deskripsi TP mentah di dalam pokok soal; ganti dengan studi kasus nyata.');
        fixActions.push('Hapus kutipan deskripsi TP mentah dan ganti dengan stimulus studi kasus/data spesifik.');
      }
      if (isGenericBoilerplate) {
        score -= 25;
        materiNotes.push('Pokok soal terdeteksi menggunakan pola kalimat generik yang kurang spesifik pada konten materi.');
        fixActions.push('Rumuskan stimulus kasus spesifik mata pelajaran ' + subject + '.');
      }
      if (!hasStimulus) {
        score -= 18;
        materiNotes.push(`Stimulus kontekstual pada ${tpCode} masih terlalu singkat sehingga belum mendorong penalaran tingkat tinggi (L2/L3).`);
        fixActions.push('Tambahkan pengantar kasus, data numerik, atau kutipan teks yang fungsional.');
      } else if (!hasRawTpPaste && !isGenericBoilerplate) {
        materiNotes.push(`Selaras dengan ${tpCode} pada ${subject} serta memuat stimulus kontekstual yang fungsional.`);
      }

      const isRecallOnly =
        /^(apa pengertian|definisi dari|sebutkan pengertian|kepanjangan dari|siapa penemu)/i.test(qClean) &&
        !hasStimulus;
      let cognitiveLevel = hasStimulus ? 'L3 - Penalaran (C4)' : 'L2 - Aplikasi (C3)';
      if (isRecallOnly) {
        cognitiveLevel = 'L1 - Pemahaman/Hafalan (C1–C2)';
        score -= 16;
        materiNotes.push('Soal cenderung mengukur hafalan definisi (L1), belum memenuhi standar penalaran TKA.');
        fixActions.push('Ubah pertanyaan menjadi analisis kasus atau pemecahan masalah (L2/L3).');
      }

      const minRequiredOpts = type === 'BENAR_SALAH' ? 3 : type === 'PG_KOMPLEKS' ? 4 : 5;
      if (cleanOpts.length < minRequiredOpts) {
        score -= 12;
        konstruksiNotes.push(`Jumlah opsi/pernyataan (${cleanOpts.length}) kurang dari standar ideal (${minRequiredOpts} butir).`);
        fixActions.push(`Lengkapi menjadi ${minRequiredOpts} opsi/pernyataan yang homogen.`);
      }

      const weakDistractorPattern =
        /(mengabaikan data|menunda verifikasi|semua jawaban benar|semua jawaban salah|tidak ada jawaban yang benar)/i;
      const hasWeakDistractor = cleanOpts.some((opt) => weakDistractorPattern.test(opt));
      if (hasWeakDistractor) {
        score -= 15;
        konstruksiNotes.push('Terdapat pengecoh bernada negatif ekstrem atau klise ("semua benar/salah") yang mudah ditebak siswa.');
        fixActions.push('Ganti pengecoh ekstrem dengan pengecoh rasional berbasis miskonsepsi konsep.');
      }

      if (type !== 'BENAR_SALAH' && !balanceInfo.isBalanced) {
        score -= 14;
        konstruksiNotes.push(
          `Panjang teks antar opsi tidak seimbang (selisih ${balanceInfo.maxVariancePercent}%, melebihi batas maksimal 15%).`
        );
        fixActions.push('Setarakan panjang kalimat dan tingkat rincian antara kunci jawaban dan seluruh pengecoh (selisih <= 15%).');
      } else if (!hasWeakDistractor && cleanOpts.length >= minRequiredOpts) {
        konstruksiNotes.push(
          `Konstruksi soal valid, struktur kalimat paralel, dan panjang opsi seimbang (selisih ${balanceInfo.maxVariancePercent}% <= 15%).`
        );
      }

      const nonStandardWords = ['analisa', 'aktifitas', 'resiko', 'praktek', 'tehnik', 'sistim', 'mensosialisasikan', 'meminimalisir', 'mensukseskan'];
      const foundNonStandard = nonStandardWords.filter((w) => new RegExp(`\\b${w}\\b`, 'i').test(qClean + ' ' + cleanOpts.join(' ')));
      if (foundNonStandard.length > 0) {
        score -= 10;
        bahasaNotes.push(`Ditemukan kata tidak baku menurut EYD V (${foundNonStandard.join(', ')}).`);
        fixActions.push(`Perbaiki kata tidak baku (${foundNonStandard.join(', ')}) sesuai KBBI & EYD V.`);
      } else {
        bahasaNotes.push('Menggunakan bahasa Indonesia baku sesuai kaidah EYD Edisi V, lugas, dan bebas bias.');
      }

      const finalScore = Math.max(40, Math.min(98, score));
      const status =
        finalScore >= 85
          ? 'Layak Digunakan (Valid TKA)'
          : finalScore >= 70
          ? 'Layak dengan Catatan Revisi'
          : 'Perlu Revisi Substansial (Belum Memenuhi Syarat TKA)';

      return {
        cognitiveLevel,
        feasibilityScore: finalScore,
        status,
        materiCheck: materiNotes.join(' '),
        konstruksiCheck: konstruksiNotes.join(' '),
        bahasaCheck: bahasaNotes.join(' '),
        recommendation:
          fixActions.length === 0
            ? 'Butir soal memenuhi standar Perka BSKAP No. 45 & 47/2025 dan siap diujikan.'
            : 'Saran perbaikan: ' + fixActions.join(' '),
      };
    }

    async function runTkaQualityAnalysis({ subject, tpCode, tpDesc, type, questionText, options }) {
      const cleanOpts = (options || []).filter((o) => String(o).trim() !== '');
      const localAudit = runLocalTkaAuditHeuristic({
        subject,
        tpCode,
        tpDesc,
        type,
        questionText,
        options: cleanOpts,
      });

      const sysPrompt = `Anda adalah penelaah kritis butir soal Tes Kemampuan Akademik (TKA) Pusmendik Kemendikdasmen RI berdasarkan Permendikdasmen No. 9/2025 dan Perka BSKAP No. 45 & 47/2025.
Berikan penilaian OBJEKTIF dan KRITIS:
- Turunkan skor kelayakan secara tegas (di bawah 75%) jika soal bersifat generik, menyalin teks TP mentah, tidak memiliki stimulus fungsional, hanya mengukur hafalan (L1), memiliki pengecoh lemah/ekstrem, atau selisih panjang opsi > 15%.
- Berikan skor >= 85% HANYA jika stimulus autentik, level kognitif L2/L3, pengecoh homogen berbasis miskonsepsi, panjang opsi seragam (<= 15%), dan bahasa sesuai EYD V.`;

      const usrPrompt = `Telaah secara kritis butir soal TKA berikut:
- Mata Pelajaran: ${subject}
- Tujuan Pembelajaran (${tpCode}): ${tpDesc}
- Bentuk Soal: ${type}
- Pertanyaan / Stimulus: ${questionText}
- Pilihan / Pernyataan: ${cleanOpts.join(' | ')}`;

      const schema = {
        type: 'OBJECT',
        properties: {
          cognitiveLevel: { type: 'STRING' },
          feasibilityScore: { type: 'INTEGER' },
          status: { type: 'STRING' },
          materiCheck: { type: 'STRING' },
          konstruksiCheck: { type: 'STRING' },
          bahasaCheck: { type: 'STRING' },
          recommendation: { type: 'STRING' },
        },
        required: [
          'cognitiveLevel',
          'feasibilityScore',
          'status',
          'materiCheck',
          'konstruksiCheck',
          'bahasaCheck',
          'recommendation',
        ],
      };

      try {
        const aiAudit = await callGeminiTkaJson(sysPrompt, usrPrompt, schema);
        const boundedScore = Math.min(Number(aiAudit.feasibilityScore) || localAudit.feasibilityScore, localAudit.feasibilityScore);
        return {
          ...aiAudit,
          feasibilityScore: boundedScore,
          status:
            boundedScore >= 85
              ? 'Layak Digunakan (Valid TKA)'
              : boundedScore >= 70
              ? 'Layak dengan Catatan Revisi'
              : 'Perlu Revisi Substansial (Belum Memenuhi Syarat TKA)',
        };
      } catch {
        return localAudit;
      }
    }

    async function handleAnalyzeManualButton() {

    function handleEditQuestion(qId) {
      const q = state.questions.find((item) => item.id === qId);
      if (!q) return;

      let options = ['', '', '', '', ''];
      let correctPg = 0;
      let correctMulti = [0];
      let statements = ['', '', ''];
      let correctBs = [true, false, true];

      if (q.type === 'BENAR_SALAH') {
        statements = Array.isArray(q.options) && q.options.length > 0 ? [...q.options] : ['', '', ''];
        correctBs =
          Array.isArray(q.correctAnswer) && q.correctAnswer.length === statements.length
            ? [...q.correctAnswer]
            : statements.map(() => true);
      } else {
        options = Array.isArray(q.options) ? [...q.options] : ['', '', '', '', ''];
        while (options.length < 5) options.push('');
        if (q.type === 'PG_KOMPLEKS') {
          correctMulti = Array.isArray(q.correctAnswer) ? [...q.correctAnswer] : [0];
        } else {
          correctPg = typeof q.correctAnswer === 'number' ? q.correctAnswer : 0;
        }
      }

      state.qForm = {
        editingId: q.id,
        tpId: q.tpId || '',
        type: q.type || 'PG',
        text: q.questionText || '',
        options,
        correctPg,
        correctMulti,
        statements,
        correctBs,
        weight: q.weight || 20,
        analysisPreview: q.analysis || null,
        isAnalyzing: false,
      };
      state.tpSubTab = 'bank_soal';
      renderApp();
    }

    async function handleSaveQuestion(e) {
      e.preventDefault();
      const ws = getWorkspaceTeacher();
      if (!ws) return;
      if (!state.qForm.text.trim()) {
        showToast('Teks pertanyaan soal wajib diisi.', 'error', 'Data Belum Lengkap');
        return;
      }

      const wsTps = state.tps.filter((t) => isOwnedByTeacher(t, ws));
      const selectedTp = wsTps.find((t) => t.id === state.qForm.tpId) || wsTps[0];
      const tpCode = selectedTp ? selectedTp.code : 'TP.1';

      let finalOptions = [];
      let finalCorrect = null;

      if (state.qForm.type === 'BENAR_SALAH') {
        const validPairs = state.qForm.statements
          .map((st, idx) => ({ st: st.trim(), ans: Boolean(state.qForm.correctBs[idx]) }))
          .filter((item) => item.st !== '');
        if (validPairs.length === 0) {
          showToast('Isi minimal 1 pernyataan untuk soal Benar/Salah.', 'error', 'Data Belum Lengkap');
          return;
        }
        finalOptions = validPairs.map((p) => p.st);
        finalCorrect = validPairs.map((p) => p.ans);
      } else {
        const trimmedOpts = state.qForm.options.map((o) => o.trim()).filter((o) => o !== '');
        if (trimmedOpts.length < 2) {
          showToast('Isi minimal 2 pilihan jawaban.', 'error', 'Data Belum Lengkap');
          return;
        }
        finalOptions = trimmedOpts;

        if (state.qForm.type === 'PG') {
          if (state.qForm.correctPg >= finalOptions.length) {
            showToast('Pilih kunci jawaban pada opsi yang terisi.', 'error', 'Kunci Belum Dipilih');
            return;
          }
          finalCorrect = state.qForm.correctPg;
        } else {
          const validMulti = state.qForm.correctMulti.filter((idx) => idx < finalOptions.length);
          if (validMulti.length === 0) {
            showToast('Pilih minimal 1 kunci jawaban untuk Pilihan Ganda Kompleks.', 'error', 'Kunci Belum Dipilih');
            return;
          }
          finalCorrect = validMulti.sort((a, b) => a - b);
        }
      }

      const wasEditingQ = Boolean(state.qForm.editingId);
      const existingQ = wasEditingQ ? state.questions.find((q) => q.id === state.qForm.editingId) : null;

      await runWithSavingAnimation(
        wasEditingQ
          ? 'Menyimpan perubahan & menganalisis kelayakan soal TKA...'
          : 'Menyimpan butir soal & menjalankan analisis syarat TKA...',
        async () => {
          const analysisResult =
            state.qForm.analysisPreview ||
            (await runTkaQualityAnalysis({
              subject: ws.subject,
              tpCode,
              tpDesc: selectedTp?.description || 'Tujuan Pembelajaran Terkait',
              type: state.qForm.type,
              questionText: state.qForm.text.trim(),
              options: finalOptions,
            }));

          await saveRecordUnified('questions', state.qForm.editingId, {
            teacherId: ws.id,
            teacherToken: ws.token,
            tpId: selectedTp ? selectedTp.id : '',
            tpCode,
            type: state.qForm.type,
            questionText: state.qForm.text.trim(),
            optionsJson: JSON.stringify(finalOptions),
            correctAnswerJson: JSON.stringify(finalCorrect),
            weight: Number(state.qForm.weight) || 20,
            order: existingQ?.order || getNextQuestionOrder(ws),
            analysisJson: JSON.stringify(analysisResult),
            createdAt: existingQ?.createdAt || new Date().toISOString(),
          });

          // Jika guru menambahkan soal baru, selaraskan kuota targetQuestionCount dengan total soal terbaru
          if (!wasEditingQ) {
            const totalWsQuestions = state.questions.filter((q) => isOwnedByTeacher(q, ws)).length;
            const latestWs = state.teachers.find((t) => t.id === ws.id) || ws;
            await saveRecordUnified('teachers', latestWs.id, {
              ...latestWs,
              targetQuestionCount: totalWsQuestions,
            });
            state.examQuestionCountInput = totalWsQuestions;
          }

          resetQuestionForm();
        },
        wasEditingQ
          ? 'Perubahan butir soal & analisis TKA berhasil disimpan!'
          : 'Butir soal TKA baru & hasil analisis kelayakan berhasil disimpan!'
      );
      renderApp();
    }

    async function handleAddTeacher(e) {
      e.preventDefault();
      const name = state.teacherForm.name.trim();
      const subject = state.teacherForm.subject.trim();
      const username = state.teacherForm.username.trim().toLowerCase();
      const password = state.teacherForm.password.trim();

      if (!name || !subject || !username || !password) {
        showToast('Semua kolom (Nama Guru, Nama Mapel, Username, Password) wajib diisi.', 'error', 'Data Belum Lengkap');
        return;
      }

      const duplicateUser = state.teachers.some(
        (t) => (t.username || '').toLowerCase() === username && t.id !== state.teacherForm.editingId
      );
      if (duplicateUser) {
        showToast(`Username "${username}" sudah digunakan. Gunakan username lain.`, 'error', 'Username Duplikat');
        return;

    function getFilteredRekapSessions() {
      const cur = getCurrentTeacher();
      if (!cur) return [];
      const cleanSessions = deduplicateSessionsList(state.sessions);
      let base = cur.role === 'guru' ? cleanSessions.filter((s) => s.teacherId === cur.id) : cleanSessions;

      if (cur.role === 'proktor' && state.rekapFilter.teacherId !== 'ALL') {
        base = base.filter((s) => s.teacherId === state.rekapFilter.teacherId);
      }

      return base.filter((s) => {
        const q = state.rekapFilter.search.trim().toLowerCase();
        const matchQuery =
          !q ||
          (s.studentName || '').toLowerCase().includes(q) ||
          (s.nisn || '').toLowerCase().includes(q) ||
          (s.studentClass || '').toLowerCase().includes(q) ||
          (s.subject || '').toLowerCase().includes(q);

        const matchStatus =
          state.rekapFilter.status === 'ALL' ||
          (state.rekapFilter.status === 'TUNTAS' && s.status === 'selesai' && s.passed) ||
          (state.rekapFilter.status === 'BELUM' && s.status === 'selesai' && !s.passed);

        return matchQuery && matchStatus;
      });
    }

      const numericScore = Math.max(0, Math.min(100, Number(m.score) || 0));

        showToast('Nama Siswa, NISN, dan Kelas wajib diisi.', 'error');

        async () => {

            studentName: cleanName,
            nisn: cleanNisn,

            teacherId: m.teacherId || '',
            teacherName: m.teacherName || '',
            subject: m.subject || '',
            tokenUsed: m.tokenUsed || '',
            score: isFinished ? numericScore : 0,
            passed: isFinished ? numericScore >= 75 : false,
            status: m.status,
            startedAt: m.startedAt || new Date().toISOString(),
            finishedAt: isFinished && !m.finishedAt ? new Date().toISOString() : m.finishedAt || '',

    function handleExportCsv() {
      const list = getFilteredRekapSessions();
      if (list.length === 0) {
        showToast('Tidak ada data nilai untuk diekspor.', 'error');
        return;
      }

      const headers = [
        'No',
        'Nama Siswa',
        'NISN / Username',
        'Kelas',
        'Mata Pelajaran',
        'Guru Pengampu',
        'Token Digunakan',
        'Status Pengerjaan',
        'Waktu Selesai',
        'Skor Akhir (0-100)',
        'Predikat Ketuntasan',
        'Rincian Ketercapaian TP',
      ];

      const rows = list.map((s, idx) => {
        const tpText = (s.tpBreakdown || [])
          .map((tp) => `${tp.tpCode}: ${tp.score}% (${tp.passed ? 'Tuntas' : 'Belum'})`)
          .join(' | ');
        return [
          idx + 1,
          `"${(s.studentName || '').replace(/"/g, '""')}"`,
          `"${(s.nisn || '').replace(/"/g, '""')}"`,
          `"${(s.studentClass || '').replace(/"/g, '""')}"`,
          `"${(s.subject || '').replace(/"/g, '""')}"`,
          `"${(s.teacherName || '').replace(/"/g, '""')}"`,
          `"${s.tokenUsed || ''}"`,
          s.status === 'selesai' ? 'Selesai' : 'Sedang Mengerjakan',
          `"${formatWaktuID(s.finishedAt)}"`,
          s.status === 'selesai' ? s.score : 0,
          s.status === 'selesai' ? (s.passed ? 'Tuntas' : 'Belum Tuntas') : 'Proses',
          `"${tpText}"`,
        ].join(',');
      });

      const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `Rekap_Nilai_TKA_2026_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('File Rekap Nilai CSV/Excel berhasil diunduh!');
    }

    function toggleLeftSidebarMobile(open) {

    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      if (state.currentView !== 'proktor') {
        const drawerContainer = document.getElementById('feature-drawer-container');
        if (drawerContainer) drawerContainer.innerHTML = '';
      }

      if (state.currentView === 'student_confirm') {
        root.innerHTML = renderStudentConfirmView();
      } else if (state.currentView === 'student_exam') {
        root.innerHTML = renderStudentExamView();
      } else if (state.currentView === 'student_result') {
        root.innerHTML = renderStudentResultView();
      } else if (state.currentView === 'proktor') {
        root.innerHTML = renderProktorDashboardView();
      } else {
        root.innerHTML = renderLoginView();
      }

      renderModals();
    }

    let globalIntervalId = null;

    function startBackgroundTimers() {
      if (globalIntervalId) clearInterval(globalIntervalId);
      globalIntervalId = setInterval(() => {
        const clockEl = document.getElementById('live-clock');
        if (clockEl) {
          const now = new Date();
          clockEl.textContent = `${now.toLocaleDateString('id-ID', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
          })} ${now.toLocaleTimeString('id-ID')}`;
        }

        if (state.currentView === 'student_exam') {
          if (state.studentSession.remainingSeconds > 0) {
            state.studentSession.remainingSeconds -= 1;
            const timerEl = document.getElementById('exam-timer');
            if (timerEl) {
              timerEl.innerHTML = `<span>Sisa Waktu: ${formatCountdown(state.studentSession.remainingSeconds)}</span>`;
              if (state.studentSession.remainingSeconds <= 300) {
                timerEl.className =
                  'px-3.5 py-1.5 rounded-lg font-mono font-extrabold text-sm flex items-center gap-2 shadow-inner bg-red-600 text-white animate-pulse';
              }
            }
            if (state.studentSession.remainingSeconds <= 0) {
              handleFinishExam(true);
            }
          }
        }
      }, 1000);
    }

    function setupStudentExamSecurityListeners() {
      document.addEventListener('visibilitychange', () => {
        if (state.currentView === 'student_exam' && document.hidden) {
          registerStudentViolation('Berpindah tab atau menyembunyikan jendela browser ujian');
        }
      });

      window.addEventListener('blur', () => {
        if (state.currentView === 'student_exam') {
          registerStudentViolation('Keluar dari layar aplikasi ujian atau membuka aplikasi lain');
        }
      });

      document.addEventListener('fullscreenchange', () => {
        if (
          state.currentView === 'student_exam' &&
          !document.fullscreenElement &&
          !state.studentSession.isEnteringFullscreen &&
          !state.isSubmittingExam
        ) {
          registerStudentViolation('Keluar dari mode layar penuh (Fullscreen)');
        }
      });

      document.addEventListener('contextmenu', (e) => {
        if (state.currentView === 'student_exam') {
          e.preventDefault();
          showToast('Klik kanan dinonaktifkan selama ujian berlangsung.', 'warning', 'Keamanan Ujian');
        }
      });

      ['copy', 'cut', 'paste'].forEach((evtName) => {
        document.addEventListener(evtName, (e) => {
          if (state.currentView === 'student_exam') {
            e.preventDefault();
            showToast('Menyalin atau menempel teks dilarang selama ujian berlangsung.', 'warning', 'Keamanan Ujian');
          }
        });
      });

      document.addEventListener('keydown', (e) => {
        if (state.currentView !== 'student_exam') return;
        const key = String(e.key || '').toLowerCase();
        const isCtrlOrMeta = e.ctrlKey || e.metaKey;

        if (
          e.key === 'F12' ||
          (isCtrlOrMeta && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) ||
          (isCtrlOrMeta && (key === 't' || key === 'n' || key === 'w'))
        ) {
          e.preventDefault();
          registerStudentViolation('Mencoba membuka tab/jendela baru atau alat pengembang');
          return;
        }

        if (isCtrlOrMeta && (key === 'c' || key === 'v' || key === 'x' || key === 'a' || key === 'u' || key === 's' || key === 'p')) {
          e.preventDefault();
          showToast('Pintasan keyboard tersebut dinonaktifkan selama ujian.', 'warning', 'Keamanan Ujian');
        }
      });
    }

    window.onload = async function () {
      loadLocalBackupDb();
      state.geminiApiKeyInput = getStoredGeminiApiKey();
      setupStudentExamSecurityListeners();
      renderApp();
      startBackgroundTimers();
      if (isSpreadsheetMode()) {
        await fetchFromSpreadsheet(state.spreadsheetApiUrl, true);
      }
    };
  </script>
</body>
</html>
